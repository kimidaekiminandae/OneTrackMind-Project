<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/login.css">
    <script src="https://kit.fontawesome.com/aaf816bed9.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
    <title>Login</title>
</head>

<body>

    <div id="page">

        <div id="top-nav">
            <div id="logo">
                <img src="/images/logo.png" alt="One Track Mind Logo">
                <h2 class="zain-bold">One Track Mind</h2>
            </div>
            <div id="about">
                <h2 class="zain-bold">About</h2>
            </div>
        </div>

        <div id="content">

            <div id="login-container">
                <h1 class="zain-bold">Login</h1>
                <button type="button" class="zain-regular" onclick="window.location.href='/auth/login'">
                    Find who's on your mind...
                </button>
            </div>

        </div>

        <div id="bottom-nav">
            <div id="chat" class="nav-tab">
                <h2 class="zain-bold">Chat</h2>
                <i class="fa-solid fa-comment"></i>
            </div>
            <div id="home" class="nav-tab">
                <h2 class="zain-bold">Home</h2>
                <i class="fa-solid fa-house"></i>
            </div>
            <div id="profile" class="nav-tab">
                <h2 class="zain-bold">Profile</h2>
                <i class="fa-solid fa-user"></i>
            </div>
        </div>

    </div>

    <script src="/javascripts/all_pages.js"></script>
    <script src="/javascripts/login.js"></script>
</body>
</html>
